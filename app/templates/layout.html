<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{config['TITLE']}}{% block title %}{% endblock %}</title>
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='/images/favicon-96x96.png') }}" sizes="96x96">
        <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
        <meta name="apple-mobile-web-app-title" content="Orca">
        <link rel="manifest" href="{{ url_for('static', filename='images/site.webmanifest') }}">
        <!-- Bootstrap core CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- Font DM Mono -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
        <!-- CSS files -->
         <link rel="stylesheet" href="{{url_for('static', filename='css/layout.css')}}">
        {% block link_css %}{% endblock %}
    </head>
    <body>
        <header>
            <div class="px-3 py-2 fundo-escuro border-bottom">
                <div class="container">
                    <div class="d-flex flex-wrap">
                        <a href="/" class="d-flex text-white text-decoration-none align-items-center col-12 col-lg-8 justify-content-center justify-content-lg-start"><img src="{{ url_for('static', filename='images/favicon.svg') }}" alt="Icone" width="40" height="40"> <h5 id="titulo" class="ms-3">{{ config['TITLE'] }}</h5></a>
                        <ul class="nav col-12 col-lg-4 justify-content-center justify-content-lg-end text-small mt-2 mt-lg-0">
                            <li> <a href="/" class="nav-link text-white">Home</a> </li>
                            <li> <a href="#" class="nav-link text-secondary">Relatorios</a> </li>
                        </ul>
                    </div>
                </div>
            </div>
        </header>
        
        {% block main %}
        {% endblock  %}

        <footer class="container-fluid text-center mt-auto fixed-bottom pt-2 pb-2 fundo-escuro text-small text-white w-100">
          <div class="align-items-center">
            <a href="/" class="text-decoration-none lh-1">
                <img class="me-2" src="{{url_for('static', filename='images/favicon.svg')}}" alt="App Logo" width="25px" height="25px" style="border-radius: 25px;">
            </a>
            <span class=""><strong>{{config['TITLE']}}</strong> - {{ datetime.now().strftime('%d/%m/%Y') }}</span>
          </div>
        </footer>

        {% block js %}
        {% endblock %}
        <script>
            if ('serviceWorker' in navigator) {
                // Aponta para a rota raiz que criamos no Python
                navigator.serviceWorker.register('/sw.js')
                .then(() => console.log("Service Worker ativo na raiz!"))
                .catch(err => console.error("Erro no Service Worker:", err));
            }
        </script>
    </body>
</html>
