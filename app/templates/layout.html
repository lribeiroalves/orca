<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{config['TITLE']}}{% block title %}{% endblock %}</title>
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='/images/favicon-96x96.png') }}" sizes="96x96">
        <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
        <meta name="apple-mobile-web-app-title" content="Orca">
        <link rel="manifest" href="{{ url_for('static', filename='images/site.webmanifest') }}">
        <!-- Bootstrap core CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- CSS files -->
         <link rel="stylesheet" href="{{url_for('static', filename='css/layout.css')}}">
        {% block link_css %}{% endblock %}
    </head>
    <body>
        {% block main %}
        {% endblock  %}

        {% block js %}
        {% endblock %}
        <script>
            if ('serviceWorker' in navigator) {
                // Aponta para a rota raiz que criamos no Python
                navigator.serviceWorker.register('/sw.js')
                .then(() => console.log("Service Worker ativo na raiz!"))
                .catch(err => console.error("Erro no Service Worker:", err));
            }
        </script>
    </body>
</html>
