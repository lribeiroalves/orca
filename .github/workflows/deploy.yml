name: CI/CD - Docker Hub & Servidor Local

on:
    push:
        branches:
            [ main ]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4
            
            # Configura o ambiente Docker no GitHub Actions
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            # Faz login no Docker Hub
            - name: Login no Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            # Builda o Dockerfile e envia para o Docker Hub
            - name: Build and Push da imagem
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                platforms: linux/amd64,linux/arm64
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/orca:latest
                # Ativa o cache para os próximos builds ficarem rápidos:
                cache-from: type=gha
                cache-to: type=gha,mode=max
    
    deploy:
        needs: build-and-push # Só roda o deploy se o build no Docker Hub der certo
        runs-on: ubuntu-latest
        steps:
        - name: Executar Comandos no Servidor via SSH
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            port: ${{ secrets.SSH_PORT }}
            script: |
                cd ~/server/orca
            
                docker compose pull
            
                docker compose up -d